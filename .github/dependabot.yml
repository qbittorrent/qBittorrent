version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "GHA CI"
    groups:
      GHA_CI-dependency-update:
        patterns:
          - "*"
    labels:
      - "CI"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pre-commit"
    directory: "/"
    commit-message:
      prefix: "GHA CI"
    groups:
      GHA_CI-dependency-update:
        patterns:
          - "*"
    labels:
      - "CI"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pip"
    directories:
      - "/.github/workflows/helper/python-tools"
      - "/.github/workflows/helper/uv"
      - "/.github/workflows/helper/zizmor"
    commit-message:
      prefix: "GHA CI"
    cooldown:
      default-days: 7
    groups:
      GHA_CI-dependency-update:
        patterns:
          - "*"
    labels:
      - "CI"
    schedule:
      interval: "monthly"

  - package-ecosystem: "uv"
    directory: "/src/searchengine/nova3"
    commit-message:
      prefix: "Search"
    cooldown:
      default-days: 7
    groups:
      Search-dependency-update:
        patterns:
          - "*"
    labels:
      - "Search engine"
    schedule:
      interval: "monthly"
