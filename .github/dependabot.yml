version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "GHA CI"
    groups:
      GHA_CI-dependency-update:
        patterns:
          - "*"
    labels:
      - "CI"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pre-commit"
    directory: "/"
    commit-message:
      prefix: "GHA CI"
    groups:
      GHA_CI-dependency-update:
        patterns:
          - "*"
    labels:
      - "CI"
    schedule:
      interval: "monthly"

  - package-ecosystem: "npm"
    directory: "/src/webui/www"
    commit-message:
      prefix: "WebUI"
    cooldown:
      default-days: 7
    groups:
      WebUI-dependency-update:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "WebUI"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pip"
    directory: "/.github/workflows/helper/zizmor"
    commit-message:
      prefix: "GHA CI"
    cooldown:
      default-days: 7
    groups:
      GHA_CI-dependency-update:
        patterns:
          - "*"
    labels:
      - "CI"
    schedule:
      interval: "monthly"
