name: Stale bot

on:
  schedule:
    - cron: '0 0 * * *'

permissions: {}

jobs:
  stale:
    name: Mark and close stale PRs
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - name: Mark and close stale PRs
        uses: actions/stale@v11
        with:
          stale-pr-message: "This PR is stale because it has been 30 days with no activity. It will be automatically closed in 7 days if there is no further activity."
          close-pr-message: "This PR was closed because it has been stale for some time with no activity."
          days-before-stale: -1 # avoid marking issues
          days-before-pr-stale: 30
          days-before-close: -1 # avoid closing issues
          days-before-pr-close: 7
          exempt-all-pr-assignees: true  # avoid stale for PRs that have assignees
          exempt-pr-milestones: 'backlog'  # avoid stale for PRs that have the `backlog` milestone
          operations-per-run: 200
