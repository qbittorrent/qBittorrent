name: CI - Python

on: [pull_request, push]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.head_ref != '' }}

jobs:
  ci:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup python (auxiliary scripts)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install tools (auxiliary scripts)
        run: |
          pip install --require-hashes --only-binary :all: -r .github/workflows/helper/python-tools/requirements.txt

      - name: Gather files (auxiliary scripts)
        run: |
          export "PY_FILES=$(find . -type f -name '*.py' ! -path '*searchengine*' -printf '%p ')"
          echo $PY_FILES
          echo "PY_FILES=$PY_FILES" >> "$GITHUB_ENV"

      - name: Check typings (auxiliary scripts)
        run: |
          mypy --strict $PY_FILES
          pyright --project src/searchengine/nova3/pyproject.toml $PY_FILES

      - name: Lint code (auxiliary scripts)
        run: |
          ruff \
            check \
            --ignore "BLE001,UP045" \
            $PY_FILES
          pyflakes \
            $PY_FILES
          bandit \
            --skip B101,B314,B405 \
            $PY_FILES

      - name: Format code (auxiliary scripts)
        run: |
          pycodestyle \
            --max-line-length=1000 \
            --statistics \
            $PY_FILES

      - name: Build code (auxiliary scripts)
        run: |
          python -m compileall $PY_FILES

      - name: Setup python (search engine)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install tools (search engine)
        working-directory: src/searchengine/nova3
        run: |
          pip install --require-hashes --only-binary :all: -r "$GITHUB_WORKSPACE/.github/workflows/helper/uv/requirements.txt"
          uv sync --locked --no-build

      - name: Check typings (search engine)
        working-directory: src/searchengine/nova3
        run: uv run just check

      - name: Lint code (search engine)
        working-directory: src/searchengine/nova3
        run: uv run just lint

      - name: Format code (search engine)
        working-directory: src/searchengine/nova3
        run: |
          uv run just format
          git diff --exit-code

      - name: Build code (search engine)
        working-directory: src/searchengine/nova3
        run: uv run just build
