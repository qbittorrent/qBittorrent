[project]
name = "qBittorrent-search-engine"
description = "Search engine for qBittorrent search feature"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]

[dependency-groups]
dev = [
    "bandit",
    "mypy",
    "pycodestyle",
    "pydoclint",
    "pyflakes",
    "pyright",
    "pytest",
    "ruff",
    "rust-just",
]

[tool.mypy]
explicit_package_bases = true
strict = true

[tool.pydoclint]
style = "sphinx"
arg-type-hints-in-docstring = false
check-return-types = false

[tool.pyright]
typeCheckingMode = "strict"

[tool.ruff]
line-length = 1000

[tool.ruff.lint]
ignore = ["FA100", "FA102", "UP045"]

[tool.setuptools.packages.find]
where = ["./"]
