<!DOCTYPE html>
<html lang="${LANG}" class="dark">

<head>
    <meta charset="UTF-8">
    <title>QBT_TR(New Category)QBT_TR[CONTEXT=Category]</title>
    <link rel="stylesheet" href="css/style.css?v=${CACHEID}" type="text/css">
    <style>
        #shareLimitsGrid {
            display: grid;
            grid-template-columns: max-content max-content max-content max-content;
            align-items: center;
            gap: 6px 8px;
        }

        #shareLimitsGrid select,
        #shareLimitsGrid input[type="number"] {
            width: 100%;
            box-sizing: border-box;
        }

        #shareLimitsGrid input[type="number"] {
            min-width: 90px;
        }

        #shareLimitsGrid>.shareLimitsActionRow {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #shareLimitsGrid .shareLimitsWideSelect {
            grid-column: 2 / -1;
        }

    </style>
    <script defer src="scripts/localpreferences.js?v=${CACHEID}"></script>
    <script defer src="scripts/color-scheme.js?v=${CACHEID}"></script>
    <script defer src="scripts/misc.js?locale=${LANG}&v=${CACHEID}"></script>
    <script defer src="scripts/pathAutofill.js?v=${CACHEID}"></script>
    <script>
        "use strict";

        window.addEventListener("DOMContentLoaded", (event) => {
            window.addEventListener("keydown", (event) => {
                switch (event.key) {
                    case "Enter":
                        event.preventDefault();
                        document.getElementById("categoryNameButton").click();
                        break;
                    case "Escape":
                        event.preventDefault();
                        window.parent.qBittorrent.Client.closeFrameWindow(window);
                        break;
                }
            });

            const defaultDownloadPath = () => {
                const category = document.getElementById("categoryName").value.trim();
                return `${pref.temp_path}/${category}`;
            };

            const setDownloadPath = (option) => {
                const downloadPath = document.getElementById("downloadPath");
                const defaultPath = defaultDownloadPath();
                switch (option) {
                    case "default":
                        downloadPath.disabled = true;
                        downloadPath.value = pref.temp_path_enabled ? defaultPath : "";
                        downloadPath.placeholder = "";
                        break;
                    case "yes":
                        downloadPath.disabled = false;
                        if ((categoryData !== undefined) && (categoryData.downloadPath !== false) && (categoryData.downloadPath !== null))
                            downloadPath.value = categoryData.downloadPath;
                        else
                            downloadPath.value = "";
                        downloadPath.placeholder = defaultPath;
                        break;
                    case "no":
                        downloadPath.disabled = true;
                        downloadPath.value = "";
                        downloadPath.placeholder = "";
                        break;
                }
            };

            const UseDefaultLimit = -2;
            const NoLimit = -1;

            // `app/preferences` reports the global share limit action as the raw enum value
            const ShareLimitActionNames = ["Stop", "Remove", "EnableSuperSeeding", "RemoveWithContent"];

            const shareLimitFields = [
                ["categoryRatioLimitMode", "categoryRatioLimit", "ratioLimit"],
                ["categorySeedingTimeLimitMode", "categorySeedingTimeLimit", "seedingTimeLimit"],
                ["categoryInactiveSeedingTimeLimitMode", "categoryInactiveSeedingTimeLimit", "inactiveSeedingTimeLimit"]
            ];

            const rememberedShareLimit = {
                categoryRatioLimit: "1.00",
                categorySeedingTimeLimit: "1440",
                categoryInactiveSeedingTimeLimit: "1440"
            };

            // what an unset limit resolves to, so that a disabled box can show the value it
            // inherits the way the GUI does. Refreshed whenever the parent category changes
            let inheritsFromParentCategory = false;
            let inheritedShareLimits = {};

            const inheritedValueText = (limitKey) => {
                const limit = inheritedShareLimits[limitKey];
                if (limit < 0)
                    return "";
                return (limitKey === "ratioLimit") ? limit.toFixed(2) : String(limit);
            };

            const updateShareLimitInput = (modeID, valueID, limitKey) => {
                const valueElem = document.getElementById(valueID);
                const mode = document.getElementById(modeID).value;
                const isCustom = (mode === "custom");

                if (!isCustom && !valueElem.disabled && (valueElem.value !== ""))
                    rememberedShareLimit[valueID] = valueElem.value;

                valueElem.disabled = !isCustom;
                valueElem.value = "";
                switch (mode) {
                    case "custom":
                        valueElem.value = rememberedShareLimit[valueID];
                        break;
                    case "default":
                        valueElem.value = inheritedValueText(limitKey);
                        break;
                }
            };

            const setShareLimit = (modeID, valueID, limitKey, limit) => {
                const modeElem = document.getElementById(modeID);
                switch (limit) {
                    case UseDefaultLimit:
                    case null:
                    case undefined:
                        modeElem.value = "default";
                        break;
                    case NoLimit:
                        modeElem.value = "unlimited";
                        break;
                    default:
                        modeElem.value = "custom";
                        rememberedShareLimit[valueID] = limit;
                        break;
                }
                updateShareLimitInput(modeID, valueID, limitKey);
            };

            const getShareLimit = (modeID, valueID) => {
                switch (document.getElementById(modeID).value) {
                    case "default":
                        return UseDefaultLimit;
                    case "unlimited":
                        return NoLimit;
                }
                return document.getElementById(valueID).value;
            };

            const searchParams = new URLSearchParams(window.location.search);
            const uriAction = window.qBittorrent.Misc.safeTrim(searchParams.get("action"));
            const uriHashes = window.qBittorrent.Misc.safeTrim(searchParams.get("hashes"));
            const uriCategoryName = window.qBittorrent.Misc.safeTrim(searchParams.get("categoryName"));

            const pref = window.parent.qBittorrent.Cache.preferences.get();
            const categoryData = window.parent.qBittorrent.Client.categoryMap.get(uriCategoryName);

            // `Session::parentCategoryName()`: the text before the last separator, so a name whose
            // only separator is the first character has no parent name
            const parentCategoryName = (categoryName) => {
                const separatorIndex = categoryName.lastIndexOf("/");
                return (separatorIndex >= 0) ? categoryName.substring(0, separatorIndex) : "";
            };

            const globalShareLimits = () => ({
                ratioLimit: pref.max_ratio,
                seedingTimeLimit: pref.max_seeding_time,
                inactiveSeedingTimeLimit: pref.max_inactive_seeding_time,
                shareLimitsMode: pref.share_limits_mode,
                // `app/preferences` reports the global share limit action as the raw enum value
                shareLimitAction: ShareLimitActionNames[Number(pref.max_ratio_act)]
            });

            // `SessionImpl::categoryShareLimits()`: each limit a category leaves unset is taken from
            // its parent category, and from the global settings once the chain runs out
            const categoryShareLimits = (categoryName) => {
                if (categoryName === "")
                    return globalShareLimits();

                const own = window.parent.qBittorrent.Client.categoryMap.get(categoryName) ?? {};
                const parent = categoryShareLimits(parentCategoryName(categoryName));
                const resolve = (limit, unset, parentLimit) => (((limit === undefined) || (limit === null) || (limit === unset)) ? parentLimit : limit);
                return {
                    ratioLimit: resolve(own.ratioLimit, UseDefaultLimit, parent.ratioLimit),
                    seedingTimeLimit: resolve(own.seedingTimeLimit, UseDefaultLimit, parent.seedingTimeLimit),
                    inactiveSeedingTimeLimit: resolve(own.inactiveSeedingTimeLimit, UseDefaultLimit, parent.inactiveSeedingTimeLimit),
                    shareLimitsMode: resolve(own.shareLimitsMode, "Default", parent.shareLimitsMode),
                    shareLimitAction: resolve(own.shareLimitAction, "Default", parent.shareLimitAction)
                };
            };

            // a limit left unset is inherited from the parent category when there is one and from
            // the global settings otherwise, so name the source the way the GUI does and show the
            // value that will be used. The parent follows the name as it is typed, as
            // `categoryNameChanged()` does in the GUI
            const updateInheritedLabels = (categoryName) => {
                const parentName = parentCategoryName(categoryName);
                inheritsFromParentCategory = (parentName !== "");
                inheritedShareLimits = categoryShareLimits(parentName);

                const inheritedFromLabel = inheritsFromParentCategory
                    ? "QBT_TR(From category)QBT_TR[CONTEXT=TorrentShareLimitsWidget]"
                    : "QBT_TR(Default)QBT_TR[CONTEXT=TorrentShareLimitsWidget]";

                for (const [modeID, valueID, limitKey] of shareLimitFields) {
                    const modeElem = document.getElementById(modeID);
                    modeElem.options[0].textContent = inheritedFromLabel;
                    // only a box that is showing an inherited value needs refreshing, so that a
                    // value being typed survives a change to the name. `setDefaults()` in the GUI
                    // guards each box the same way
                    if (modeElem.value === "default")
                        document.getElementById(valueID).value = inheritedValueText(limitKey);
                }

                const setInheritedLabel = (selectID, inheritedValue) => {
                    const selectElem = document.getElementById(selectID);
                    const inheritedOption = Array.prototype.find.call(selectElem.options, (option) => option.value === inheritedValue);
                    if ((inheritedOption === undefined) || (inheritedValue === "Default")) {
                        selectElem.options[0].textContent = inheritedFromLabel;
                        return;
                    }
                    selectElem.options[0].textContent = (inheritsFromParentCategory
                        ? "QBT_TR(From category (%1))QBT_TR[CONTEXT=TorrentShareLimitsWidget]"
                        : "QBT_TR(Default (%1))QBT_TR[CONTEXT=TorrentShareLimitsWidget]").replace("%1", inheritedOption.textContent);
                };

                setInheritedLabel("categoryShareLimitsMode", inheritedShareLimits.shareLimitsMode);
                setInheritedLabel("categoryShareLimitAction", inheritedShareLimits.shareLimitAction);
            };

            updateInheritedLabels(uriCategoryName);

            const useDownloadPathElem = document.getElementById("useDownloadPath");
            const categoryNameElem = document.getElementById("categoryName");
            const savePathElem = document.getElementById("savePath");
            if (uriAction === "edit") {
                if (!uriCategoryName)
                    return;

                categoryNameElem.disabled = true;
                categoryNameElem.value = uriCategoryName;
                savePathElem.value = categoryData.savePath;
                savePathElem.placeholder = `${pref.save_path}/${uriCategoryName}`;
                savePathElem.focus();

                switch (categoryData.downloadPath) {
                    case false:
                        useDownloadPathElem.selectedIndex = 2;
                        setDownloadPath("no");
                        break;
                    case null:
                        useDownloadPathElem.selectedIndex = 0;
                        setDownloadPath("default");
                        break;
                    default:
                        useDownloadPathElem.selectedIndex = 1;
                        setDownloadPath("yes");
                        break;
                }

                setShareLimit("categoryRatioLimitMode", "categoryRatioLimit", "ratioLimit", categoryData.ratioLimit);
                setShareLimit("categorySeedingTimeLimitMode", "categorySeedingTimeLimit", "seedingTimeLimit", categoryData.seedingTimeLimit);
                setShareLimit("categoryInactiveSeedingTimeLimitMode", "categoryInactiveSeedingTimeLimit", "inactiveSeedingTimeLimit", categoryData.inactiveSeedingTimeLimit);
                document.getElementById("categoryShareLimitsMode").value = categoryData.shareLimitsMode ?? "Default";
                document.getElementById("categoryShareLimitAction").value = categoryData.shareLimitAction ?? "Default";
            }
            else if (uriAction === "createSubcategory") {
                categoryNameElem.value = uriCategoryName;
                categoryNameElem.focus();
            }
            else {
                categoryNameElem.focus();
            }

            document.getElementById("categoryNameButton").addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();

                const savePath = document.getElementById("savePath").value.trim();
                const categoryName = document.getElementById("categoryName").value.trim();

                const verifyCategoryName = (name) => {
                    if ((name === null) || (name === ""))
                        return false;
                    if (name.match("^([^\\\\\\/]|[^\\\\\\/]([^\\\\\\/]|\\/(?=[^\\/]))*[^\\\\\\/])$") === null) {
                        alert("QBT_TR(Invalid category name:\nPlease do not use any special characters in the category name.)QBT_TR[CONTEXT=HttpServer]");
                        return false;
                    }
                    return true;
                };

                const dlPathParams = {};
                const useDownloadPath = document.getElementById("useDownloadPath");
                if (useDownloadPath.value === "no") {
                    dlPathParams.downloadPathEnabled = false;
                }
                else if (useDownloadPath.value === "yes") {
                    dlPathParams.downloadPathEnabled = true;
                    dlPathParams.downloadPath = document.getElementById("downloadPath").value.trim();
                }

                // typing -1 or -2 into a custom limit is taken by the server as the "unlimited" or
                // "use global" sentinel, quietly replacing the mode that was picked. Anything else
                // invalid the server rejects by name, so catching it here only saves the round-trip
                for (const [_, valueID] of shareLimitFields) {
                    const valueElem = document.getElementById(valueID);
                    const value = valueElem.value.trim();
                    if (!valueElem.disabled && ((value === "") || (Number(value) < 0))) {
                        alert("QBT_TR(Share limit values cannot be empty or invalid.)QBT_TR[CONTEXT=TorrentShareLimitsWidget]");
                        return;
                    }
                }

                const shareLimitParams = {
                    ratioLimit: getShareLimit("categoryRatioLimitMode", "categoryRatioLimit"),
                    seedingTimeLimit: getShareLimit("categorySeedingTimeLimitMode", "categorySeedingTimeLimit"),
                    inactiveSeedingTimeLimit: getShareLimit("categoryInactiveSeedingTimeLimitMode", "categoryInactiveSeedingTimeLimit"),
                    shareLimitsMode: document.getElementById("categoryShareLimitsMode").value,
                    shareLimitAction: document.getElementById("categoryShareLimitAction").value
                };

                switch (uriAction) {
                    case "set":
                        if ((uriHashes === "") || !verifyCategoryName(categoryName))
                            return;

                        fetch("api/v2/torrents/createCategory", {
                                method: "POST",
                                body: new URLSearchParams({
                                    ...dlPathParams,
                                    ...shareLimitParams,
                                    category: categoryName,
                                    savePath: savePath
                                })
                            })
                            .then(async (response) => {
                                if (!response.ok) {
                                    const errorMessage = await response.text();
                                    alert((errorMessage !== "")
                                        ? errorMessage
                                        : `QBT_TR(Unable to create category)QBT_TR[CONTEXT=Category] ${window.qBittorrent.Misc.escapeHtml(categoryName)}`);
                                    return;
                                }

                                fetch("api/v2/torrents/setCategory", {
                                        method: "POST",
                                        body: new URLSearchParams({
                                            hashes: uriHashes,
                                            category: categoryName
                                        })
                                    })
                                    .then((response) => {
                                        if (!response.ok) {
                                            alert("QBT_TR(Unable to set category)QBT_TR[CONTEXT=Category]");
                                            return;
                                        }

                                        window.parent.updateMainData();
                                        window.parent.qBittorrent.Client.closeFrameWindow(window);
                                    });
                            });
                        break;

                    case "create":
                    case "createSubcategory":
                        if (!verifyCategoryName(categoryName))
                            return;
                        fetch("api/v2/torrents/createCategory", {
                                method: "POST",
                                body: new URLSearchParams({
                                    ...dlPathParams,
                                    ...shareLimitParams,
                                    category: categoryName,
                                    savePath: savePath
                                })
                            })
                            .then(async (response) => {
                                if (!response.ok) {
                                    const errorMessage = await response.text();
                                    alert((errorMessage !== "")
                                        ? errorMessage
                                        : "QBT_TR(Unable to create category)QBT_TR[CONTEXT=Category]");
                                    return;
                                }

                                window.parent.updateMainData();
                                window.parent.qBittorrent.Client.closeFrameWindow(window);
                            });
                        break;

                    case "edit":
                        fetch("api/v2/torrents/editCategory", {
                                method: "POST",
                                body: new URLSearchParams({
                                    ...dlPathParams,
                                    ...shareLimitParams,
                                    category: uriCategoryName, // category name can't be changed
                                    savePath: savePath
                                })
                            })
                            .then(async (response) => {
                                if (!response.ok) {
                                    if (response.status === 404) {
                                        alert("QBT_TR(Category does not exist)QBT_TR[CONTEXT=Category]");
                                    }
                                    else {
                                        const errorMessage = await response.text();
                                        alert((errorMessage !== "")
                                            ? errorMessage
                                            : "QBT_TR(Unable to edit category)QBT_TR[CONTEXT=Category]");
                                    }
                                    return;
                                }

                                window.parent.updateMainData();
                                window.parent.qBittorrent.Client.closeFrameWindow(window);
                            });
                        break;
                }
            });

            useDownloadPathElem.addEventListener("change", (e) => {
                setDownloadPath(e.target.value);
            });

            categoryNameElem.addEventListener("input", (e) => {
                updateInheritedLabels(e.target.value.trim());
            });

            for (const [modeID, valueID, limitKey] of shareLimitFields) {
                document.getElementById(modeID).addEventListener("change", (e) => {
                    updateShareLimitInput(modeID, valueID, limitKey);
                });
            }

            window.qBittorrent.pathAutofill.attachPathAutofill();
        });
    </script>
</head>

<body>
    <div style="padding: 10px 10px 0px 10px;">
        <div style="display: flex; align-items: center; margin-bottom: 6px;">
            <label for="categoryName">QBT_TR(Category:)QBT_TR[CONTEXT=Category]</label>
            <input type="text" id="categoryName" style="flex-grow: 1; margin-left: 10px;">
        </div>
        <div style="display: flex; align-items: center;">
            <label for="savePath">QBT_TR(Save path:)QBT_TR[CONTEXT=Category]</label>
            <input type="text" id="savePath" class="pathDirectory" style="flex-grow: 1; margin-left: 10px;">
        </div>

        <fieldset class="settings" style="text-align: left;">
            <legend>QBT_TR(Save path for incomplete torrents:)QBT_TR[CONTEXT=Category]</legend>

            <div style="display: flex; align-items: center;">
                <label for="useDownloadPath">QBT_TR(Use another path for incomplete torrents:)QBT_TR[CONTEXT=Category]</label>
                <select id="useDownloadPath">
                    <option selected value="default">QBT_TR(Default)QBT_TR[CONTEXT=Category]</option>
                    <option value="yes">QBT_TR(Yes)QBT_TR[CONTEXT=Category]</option>
                    <option value="no">QBT_TR(No)QBT_TR[CONTEXT=Category]</option>
                </select>
            </div>
            <div style="display: flex; align-items: center;">
                <label for="downloadPath">QBT_TR(Path:)QBT_TR[CONTEXT=Category]</label>
                <input type="text" id="downloadPath" class="pathDirectory" style="flex-grow: 1; margin-left: 10px;">
            </div>
        </fieldset>

        <fieldset class="settings" style="text-align: left;">
            <legend>QBT_TR(Torrent share limits)QBT_TR[CONTEXT=Category]</legend>

            <div id="shareLimitsGrid">
                <label id="categoryRatioLimitLabel" for="categoryRatioLimitMode">QBT_TR(Ratio:)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</label>
                <select id="categoryRatioLimitMode">
                    <option selected value="default">QBT_TR(Default)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</option>
                    <option value="unlimited">QBT_TR(Unlimited)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</option>
                    <option value="custom">QBT_TR(Set to)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</option>
                </select>
                <input type="number" id="categoryRatioLimit" step="0.01" min="0" disabled aria-labelledby="categoryRatioLimitLabel">
                <span></span>

                <label id="categorySeedingTimeLimitLabel" for="categorySeedingTimeLimitMode">QBT_TR(Seeding time:)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</label>
                <select id="categorySeedingTimeLimitMode">
                    <option selected value="default">QBT_TR(Default)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</option>
                    <option value="unlimited">QBT_TR(Unlimited)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</option>
                    <option value="custom">QBT_TR(Set to)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</option>
                </select>
                <input type="number" id="categorySeedingTimeLimit" step="1" min="0" disabled aria-labelledby="categorySeedingTimeLimitLabel">
                <span>QBT_TR(min)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</span>

                <label id="categoryInactiveSeedingTimeLimitLabel" for="categoryInactiveSeedingTimeLimitMode">QBT_TR(Inactive seeding time:)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</label>
                <select id="categoryInactiveSeedingTimeLimitMode">
                    <option selected value="default">QBT_TR(Default)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</option>
                    <option value="unlimited">QBT_TR(Unlimited)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</option>
                    <option value="custom">QBT_TR(Set to)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</option>
                </select>
                <input type="number" id="categoryInactiveSeedingTimeLimit" step="1" min="0" disabled aria-labelledby="categoryInactiveSeedingTimeLimitLabel">
                <span>QBT_TR(min)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</span>

                <label for="categoryShareLimitsMode">QBT_TR(Mode:)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</label>
                <select id="categoryShareLimitsMode" class="shareLimitsWideSelect">
                    <option selected value="Default">QBT_TR(Default)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</option>
                    <option value="MatchAny">QBT_TR(Match any limit)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</option>
                    <option value="MatchAll">QBT_TR(Match all the limits)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</option>
                </select>

                <div class="shareLimitsActionRow">
                    <label for="categoryShareLimitAction">QBT_TR(Action when the limit is reached:)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</label>
                    <select id="categoryShareLimitAction">
                        <option selected value="Default">QBT_TR(Default)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</option>
                        <option value="Stop">QBT_TR(Stop torrent)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</option>
                        <option value="Remove">QBT_TR(Remove torrent)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</option>
                        <option value="RemoveWithContent">QBT_TR(Remove torrent and its content)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</option>
                        <option value="EnableSuperSeeding">QBT_TR(Enable super seeding for torrent)QBT_TR[CONTEXT=TorrentShareLimitsWidget]</option>
                    </select>
                </div>
            </div>
        </fieldset>

        <div style="text-align: center; padding-top: 10px;">
            <input type="button" value="QBT_TR(OK)QBT_TR[CONTEXT=Category]" id="categoryNameButton">
        </div>
    </div>
</body>

</html>
