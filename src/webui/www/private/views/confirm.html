<div id="confirmDialog">
    <div class="genericConfirmGrid">
        <span class="confirmGridItem confirmWarning"></span>
        <span class="confirmGridItem dialogMessage"></span>
    </div>
</div>
<div class="dialogFooter">
    <input type="button" value="QBT_TR(Yes)QBT_TR[CONTEXT=MainWindow]" id="confirmYesButton">
    <input type="button" value="QBT_TR(No)QBT_TR[CONTEXT=MainWindow]" id="confirmNoButton">
</div>

<script>
    "use strict";

    (() => {
        const { windowEl, options } = window.MUI.Windows.instances["confirmDialog"];
        const { message, onYes } = options.data;

        const yesButton = document.getElementById("confirmYesButton");
        const noButton = document.getElementById("confirmNoButton");
        const dialog = document.getElementById("confirmDialog");

        dialog.querySelector("span.dialogMessage").textContent = message;

        noButton.addEventListener("click", (e) => {
            window.qBittorrent.Client.closeWindow(dialog);
        });
        yesButton.addEventListener("click", (e) => {
            window.qBittorrent.Client.closeWindow(dialog);
            onYes();
        });

        // set tabindex so window element receives keydown events
        windowEl.setAttribute("tabindex", "-1");
        windowEl.focus();
        windowEl.addEventListener("keydown", (e) => {
            switch (e.key) {
                case "Enter":
                    e.stopPropagation();
                    yesButton.click();
                    break;
                case "Escape":
                    e.stopPropagation();
                    window.qBittorrent.Client.closeWindow(dialog);
                    break;
            }
        });
    })();
</script>
