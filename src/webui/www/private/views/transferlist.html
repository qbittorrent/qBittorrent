<div id="torrentsSelectionBar">
    <input type="checkbox" id="torrentsSelectAll" aria-label="QBT_TR(Select All)QBT_TR[CONTEXT=MainWindow]" title="QBT_TR(Select All)QBT_TR[CONTEXT=MainWindow]">
    <span id="torrentsSelectionCount" aria-live="polite" data-format="QBT_TR(Selected: %1)QBT_TR[CONTEXT=MainWindow]"></span>
    <select id="torrentsSortSelect" aria-label="QBT_TR(Sort by)QBT_TR[CONTEXT=MainWindow]" title="QBT_TR(Sort by)QBT_TR[CONTEXT=MainWindow]"></select>
    <button type="button" id="torrentsSortOrder" aria-pressed="false" aria-label="QBT_TR(Descending)QBT_TR[CONTEXT=MainWindow]" title="QBT_TR(Descending)QBT_TR[CONTEXT=MainWindow]"></button>
    <button type="button" id="torrentsColumnsButton">QBT_TR(Columns)QBT_TR[CONTEXT=MainWindow]</button>
</div>
<div id="torrentsTableDiv" class="dynamicTableDiv">
    <div id="torrentsTableFixedHeaderDiv" class="dynamicTableFixedHeaderDiv">
        <table class="dynamicTable unselectable" style="position:relative;">
            <thead>
                <tr class="dynamicTableHeader"></tr>
            </thead>
        </table>
    </div>
    <table class="dynamicTable unselectable">
        <tbody></tbody>
    </table>
</div>

<script>
    "use strict";

    window.qBittorrent ??= {};
    window.qBittorrent.TransferList ??= (() => {
        const exports = () => {
            return {
                setup: setup,
                contextMenu: contextMenu,
            };
        };

        // create a context menu
        const contextMenu = new window.qBittorrent.ContextMenu.TorrentsTableContextMenu({
            targets: "#torrentsTableDiv tbody tr",
            menu: "torrentsTableMenu",
            actions: {
                start: (element, ref) => {
                    startFN();
                },
                stop: (element, ref) => {
                    stopFN();
                },
                forceStart: (element, ref) => {
                    setForceStartFN();
                },

                delete: (element, ref) => {
                    deleteSelectedTorrentsFN();
                },

                setLocation: (element, ref) => {
                    setLocationFN();
                },

                rename: (element, ref) => {
                    renameFN();
                },
                renameFiles: (element, ref) => {
                    renameFilesFN();
                },
                queueTop: (element, ref) => {
                    setQueuePositionFN("topPrio");
                },
                queueUp: (element, ref) => {
                    setQueuePositionFN("increasePrio");
                },
                queueDown: (element, ref) => {
                    setQueuePositionFN("decreasePrio");
                },
                queueBottom: (element, ref) => {
                    setQueuePositionFN("bottomPrio");
                },

                downloadLimit: (element, ref) => {
                    downloadLimitFN();
                },
                uploadLimit: (element, ref) => {
                    uploadLimitFN();
                },
                shareRatio: (element, ref) => {
                    shareRatioFN();
                },

                sequentialDownload: (element, ref) => {
                    toggleSequentialDownloadFN();
                },
                firstLastPiecePrio: (element, ref) => {
                    toggleFirstLastPiecePrioFN();
                },

                autoTorrentManagement: (element, ref) => {
                    autoTorrentManagementFN();
                },
                forceRecheck: (element, ref) => {
                    recheckFN();
                },
                forceReannounce: (element, ref) => {
                    reannounceFN();
                },

                superSeeding: (element, ref) => {
                    setSuperSeedingFN(!ref.getItemChecked("superSeeding"));
                },

                exportTorrent: (element, ref) => {
                    exportTorrentFN();
                }
            },
            offsets: {
                x: 0,
                y: 2
            },
        });

        const setup = () => {
            torrentsTable.setup("torrentsTableDiv", "torrentsTableFixedHeaderDiv", contextMenu);
        };

        return exports();
    })();
    Object.freeze(window.qBittorrent.TransferList);

    window.qBittorrent.TransferList.setup();
</script>
