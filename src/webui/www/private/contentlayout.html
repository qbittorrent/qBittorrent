<!DOCTYPE html>
<html lang="${LANG}" class="dark">

<head>
    <meta charset="UTF-8">
    <title>QBT_TR(Content layout)QBT_TR[CONTEXT=TransferListWidget]</title>
    <link rel="stylesheet" href="css/style.css?v=${CACHEID}" type="text/css">
    <script defer src="scripts/localpreferences.js?v=${CACHEID}"></script>
    <script defer src="scripts/color-scheme.js?v=${CACHEID}"></script>
    <script>
        "use strict";

        window.addEventListener("DOMContentLoaded", (event) => {
            window.addEventListener("keydown", (event) => {
                switch (event.key) {
                    case "Enter":
                        event.preventDefault();
                        document.getElementById("contentLayoutButton").click();
                        break;
                    case "Escape":
                        event.preventDefault();
                        window.parent.qBittorrent.Client.closeFrameWindow(window);
                        break;
                }
            });

            const searchParams = new URLSearchParams(window.location.search);

            const saveButton = document.getElementById("contentLayoutButton");
            const errorDiv = document.getElementById("error_div");

            document.getElementById("contentLayout").focus();
            saveButton.addEventListener("click", (event) => {
                event.preventDefault();
                event.stopPropagation();

                // ignore repeated clicks while the request is in flight
                if (saveButton.disabled === true)
                    return;
                saveButton.disabled = true;

                fetch("api/v2/torrents/setContentLayout", {
                        method: "POST",
                        body: new URLSearchParams({
                            hashes: searchParams.get("hashes"),
                            contentLayout: document.getElementById("contentLayout").value
                        })
                    })
                    .then(async (response) => {
                        if (response.ok !== true) {
                            errorDiv.textContent = await response.text();
                            saveButton.disabled = false;
                            return;
                        }

                        window.parent.updateMainData();
                        window.parent.qBittorrent.Client.closeFrameWindow(window);
                    })
                    .catch((error) => {
                        errorDiv.textContent = error.message;
                        saveButton.disabled = false;
                    });
            });
        });
    </script>
</head>

<body>
    <div style="padding: 10px 10px 0px 10px;">
        <label for="contentLayout" style="font-weight: bold;">QBT_TR(Content layout:)QBT_TR[CONTEXT=AddNewTorrentDialog]</label>
        <select id="contentLayout" style="width: 99%;">
            <option value="Subfolder">QBT_TR(Create subfolder)QBT_TR[CONTEXT=AddNewTorrentDialog]</option>
            <option value="NoSubfolder">QBT_TR(Don't create subfolder)QBT_TR[CONTEXT=AddNewTorrentDialog]</option>
        </select>
        <div style="float: none; width: 99%; max-height: 80px; overflow-y: auto; white-space: pre-line;" id="error_div">&nbsp;</div>
        <div style="text-align: center; padding-top: 10px;">
            <input type="button" value="QBT_TR(Save)QBT_TR[CONTEXT=HttpServer]" id="contentLayoutButton">
        </div>
    </div>
</body>

</html>
